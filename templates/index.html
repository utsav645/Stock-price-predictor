
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Price Predictor</title>
</head>
<body>
    <h2>Stock Price Predictor using ARIMA</h2>
    <form method="POST" action="/predict">
        Ticker: <input type="text" name="ticker" required><br>
        Market:
        <select name="market">
            <option value="NSE">NSE</option>
            <option value="BSE">BSE</option>
        </select><br>
        Prediction Duration (in days): <input type="number" name="duration" required><br>
        <button type="submit">Predict</button>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if predictions %}
        <h3>Predicted Prices:</h3>
        <ul>
            {% for date, price in predictions %}
                <li>{{ date }}: ₹{{ "%.2f"|format(price) }}</li>
            {% endfor %}
        </ul>
        <img src="{{ url_for('static', filename='plot.png') }}" width="700">
    {% endif %}
</body>
</html>
